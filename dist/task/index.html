<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facthor8 · Tasks</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/task/task.css"></head>
<body>
<div id="auth" class="auth"><div class="login-card"><div class="brand"><span class="mark">8</span><div><b>Facthor8</b><small>Task workspace</small></div></div><h1>Organizarnos sin complicarnos.</h1><p>Acceso privado al seguimiento de tareas, fechas y próximos pasos.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><div id="authMsg" class="msg"></div></form></div></div>
<div id="app" class="app hidden">
<header><div class="brand"><span class="mark">8</span><div><b>Facthor8</b><small>Tasks</small></div></div><nav><button class="nav active" data-view="tasks">Tareas</button><button class="nav" data-view="calendar">Calendario</button></nav><div class="user"><span id="userName"></span><button id="logout" class="ghost">Salir</button></div></header>
<main>
<section class="toolbar"><div><h1 id="viewTitle">Tareas</h1><p id="summary">Cargando...</p></div><button id="newTask" class="primary">＋ Nueva tarea</button></section>
<section id="filters" class="filters"><button class="chip active" data-filter="open">Abiertas</button><button class="chip" data-filter="mine">Mías</button><button class="chip" data-filter="waiting">Esperando</button><button class="chip" data-filter="overdue">Vencidas</button><button class="chip" data-filter="all">Todas</button></section>
<section id="tasksView"><div id="taskGrid" class="task-grid"></div></section>
<section id="calendarView" class="hidden"><div class="calendar-head"><button id="prevMonth">‹</button><h2 id="monthTitle"></h2><button id="nextMonth">›</button></div><div class="weekdays"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div><div id="calendar" class="calendar"></div></section>
</main></div>
<dialog id="taskDialog"><form method="dialog" class="modal"><div class="modal-head"><div><span id="taskStatusBadge" class="badge">Nueva</span><h2 id="modalTitle">Nueva tarea</h2></div><button class="close" value="cancel">×</button></div>
<div class="form-grid"><label class="wide">Título<input id="taskTitle" required></label><label class="wide">Descripción<textarea id="taskDescription" rows="3"></textarea></label><label>Estado<select id="taskStatus"><option value="pending">Pendiente</option><option value="in_progress">En curso</option><option value="waiting">Esperando</option><option value="done">Terminado</option></select></label><label>Prioridad<select id="taskPriority"><option value="low">Baja</option><option value="medium">Media</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label><label>Fecha límite<input id="taskDue" type="date"></label><label>Seguimiento<input id="taskFollow" type="datetime-local"></label><label class="wide">Próximo paso<input id="taskNext" placeholder="¿Qué hay que hacer ahora?"></label></div>
<div id="detailArea" class="hidden"><hr><h3>Checklist</h3><div id="subtasks"></div><div class="inline"><input id="newSubtask" placeholder="Añadir paso..."><button id="addSubtask" type="button">Añadir</button></div><h3>Seguimiento</h3><div id="updates" class="timeline"></div><div class="inline"><textarea id="newUpdate" rows="2" placeholder="¿Qué pasó? ¿Qué respondieron?"></textarea><button id="addUpdate" type="button">Guardar nota</button></div></div>
<div class="actions"><button id="deleteTask" type="button" class="danger hidden">Eliminar</button><span></span><button value="cancel" class="ghost">Cancelar</button><button id="saveTask" type="button" class="primary">Guardar</button></div><div id="taskMsg" class="msg"></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/task/task.js"></script></body></html>
